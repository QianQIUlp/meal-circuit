name: release-builds

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

concurrency:
  group: release-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 5 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate workflow syntax and semantics
        run: actionlint .github/workflows/*.yml
      - name: Verify malformed indentation is rejected
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint
        run: python -m unittest tests.test_workflow_syntax -v
      - id: version
        run: python tools/version.py --check --tag "${{ github.ref_name }}" --output "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --locked --extra server --extra sync --group dev
      - run: uv run python tools/dependency_check.py
      - run: uv run python tools/generate_openapi.py --check
      - run: uv run python tools/validate_protocol.py
      - run: uv run python tools/distribution_check.py
      - run: uv run python tools/generate_sbom.py --output "$RUNNER_TEMP/mealcircuit-locks.cdx.json"
      - run: uv run python -m unittest tests.test_release_workflow -v
      - run: uv run python -m unittest tests.test_release_sbom -v

  quality-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require private vulnerability reporting for tagged releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          enabled=$(gh api "repos/$GITHUB_REPOSITORY/private-vulnerability-reporting" --jq '.enabled')
          if [[ "$enabled" != "true" ]]; then
            echo "Tagged releases require GitHub private vulnerability reporting to be enabled." >&2
            exit 1
          fi
      - name: Wait for the complete test workflow on this tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deadline=$((SECONDS + 10800))
          while (( SECONDS < deadline )); do
            result=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow test.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 20 \
              --json status,conclusion,url,createdAt,headBranch \
              --jq 'map(select(.headBranch == env.GITHUB_REF_NAME)) | if length == 0 then "" else (sort_by(.createdAt) | reverse | .[0] | [.status, (.conclusion // ""), .url] | @tsv) end')
            if [[ -z "$result" ]]; then
              echo "Waiting for the tag-triggered test workflow to appear for $GITHUB_SHA"
              sleep 15
              continue
            fi
            IFS=$'\t' read -r status conclusion url <<< "$result"
            echo "Complete test workflow: status=$status conclusion=${conclusion:-pending} url=$url"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] && exit 0
              echo "The complete test workflow did not succeed: $conclusion" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for the complete test workflow for $GITHUB_SHA" >&2
          exit 1

  windows:
    needs: contract
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.contract.outputs.version }}
      WINDOWS_SIGNING_AVAILABLE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Authenticode secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && env.WINDOWS_SIGNING_AVAILABLE != 'true'
        shell: pwsh
        run: |
          throw "Tagged releases require complete Windows Authenticode signing secrets."
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --locked --extra desktop --no-dev
      - name: Collect locked desktop license texts
        shell: pwsh
        run: |
          $legalBundle = Join-Path $env:RUNNER_TEMP "desktop-legal"
          .\.venv\Scripts\python.exe tools\desktop_licenses.py collect --project-root . --output $legalBundle
          Add-Content -Path $env:GITHUB_ENV -Value "MEALCIRCUIT_LEGAL_BUNDLE=$legalBundle" -Encoding utf8
      - run: .\.venv\Scripts\pyinstaller.exe --noconfirm --clean packaging/mealcircuit.spec
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $env:MEALCIRCUIT_HOME = Join-Path $env:RUNNER_TEMP "desktop-smoke"
          $process = Start-Process -FilePath ".\dist\MealCircuit\MealCircuit.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed with exit code $($process.ExitCode)" }
          .\.venv\Scripts\python.exe tools\desktop_licenses.py verify --project-root . --artifact-root .\dist\MealCircuit
      - name: Exercise the packaged Windows WebView
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\MealCircuit\MealCircuit.exe" -ArgumentList "--ui-smoke-test" -PassThru
          if (-not $process.WaitForExit(70000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged Windows WebView smoke test exceeded 70 seconds"
          }
          if ($process.ExitCode -ne 0) { throw "Packaged Windows WebView smoke test failed with exit code $($process.ExitCode)" }
      - name: Authenticode sign packaged executable when configured
        if: env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\signing.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD ".\dist\MealCircuit\MealCircuit.exe"
      - name: Build portable ZIP
        shell: pwsh
        run: Compress-Archive -Path .\dist\MealCircuit -DestinationPath ".\dist\MealCircuit-$env:VERSION-windows-x64-portable.zip"
      - name: Smoke test portable ZIP
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP "portable-smoke"
          Expand-Archive -Path ".\dist\MealCircuit-$env:VERSION-windows-x64-portable.zip" -DestinationPath $portableRoot
          $env:MEALCIRCUIT_HOME = Join-Path $env:RUNNER_TEMP "portable-home"
          $process = Start-Process -FilePath "$portableRoot\MealCircuit\MealCircuit.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Portable ZIP smoke test failed with exit code $($process.ExitCode)" }
          .\.venv\Scripts\python.exe tools\desktop_licenses.py verify --project-root . --artifact-root "$portableRoot\MealCircuit"
      - name: Build installer
        shell: pwsh
        run: |
          $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $innoDir = Join-Path $env:RUNNER_TEMP "inno-6.7.3"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $innoInstaller
          $innoHash = (Get-FileHash $innoInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($innoHash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "Inno Setup checksum mismatch" }
          if ((Get-AuthenticodeSignature $innoInstaller).Status -ne "Valid") { throw "Inno Setup signature invalid" }
          $innoInstall = Start-Process -FilePath $innoInstaller -ArgumentList "/CURRENTUSER", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=$innoDir" -Wait -PassThru
          if ($innoInstall.ExitCode -ne 0) { throw "Inno Setup bootstrap failed with exit code $($innoInstall.ExitCode)" }
          try {
            & "$innoDir\ISCC.exe" "/DMyAppVersion=$env:VERSION" "/DSourceDir=$pwd\dist\MealCircuit" "/DOutputDir=$pwd\dist" packaging\windows\MealCircuit.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }
          } finally {
            $innoUninstall = Start-Process -FilePath "$innoDir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($innoUninstall.ExitCode -ne 0) { throw "Inno Setup cleanup failed with exit code $($innoUninstall.ExitCode)" }
            for ($attempt = 0; $attempt -lt 40 -and (Test-Path $innoDir); $attempt++) { Start-Sleep -Milliseconds 250 }
            if (Test-Path $innoDir) { throw "Inno Setup cleanup left its temporary installation behind: $innoDir" }
          }
      - name: Authenticode sign installer when certificate secrets are available
        if: env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\signing.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD ".\dist\MealCircuit-$env:VERSION-windows-x64-setup.exe"
          if ((Get-AuthenticodeSignature ".\dist\MealCircuit\MealCircuit.exe").Status -ne "Valid") { throw "Executable signature invalid" }
          if ((Get-AuthenticodeSignature ".\dist\MealCircuit-$env:VERSION-windows-x64-setup.exe").Status -ne "Valid") { throw "Installer signature invalid" }
      - name: Smoke test installed application and uninstaller
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "installed-smoke"
          $installer = Start-Process -FilePath ".\dist\MealCircuit-$env:VERSION-windows-x64-setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer smoke test failed with exit code $($installer.ExitCode)" }
          $env:MEALCIRCUIT_HOME = Join-Path $env:RUNNER_TEMP "installed-home"
          $application = Start-Process -FilePath "$installDir\MealCircuit.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($application.ExitCode -ne 0) { throw "Installed application smoke test failed with exit code $($application.ExitCode)" }
          .\.venv\Scripts\python.exe tools\desktop_licenses.py verify --project-root . --artifact-root $installDir
          $uninstaller = Start-Process -FilePath "$installDir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "Uninstaller smoke test failed with exit code $($uninstaller.ExitCode)" }
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $installDir); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $installDir) { throw "Uninstaller left the application directory behind: $installDir" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            dist/MealCircuit-*-windows-x64-portable.zip
            dist/MealCircuit-*-windows-x64-setup.exe

  android:
    needs: contract
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.contract.outputs.version }}
      ANDROID_SIGNING_AVAILABLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      EXPECTED_ANDROID_SIGNER_SHA256: "1A:87:F4:05:CA:18:9B:1D:B2:63:44:A9:71:55:18:C9:12:4C:66:D5:D8:00:04:CA:75:A5:9F:EA:36:25:3C:37"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Android signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_SIGNING_AVAILABLE != 'true'
        run: |
          echo "Tagged releases require complete Android signing secrets." >&2
          exit 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore release keystore when configured
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mealcircuit.jks"
      - name: Build APK and AAB
        working-directory: android
        env:
          MEALCIRCUIT_KEYSTORE_PATH: ${{ runner.temp }}/mealcircuit.jks
          MEALCIRCUIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEALCIRCUIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEALCIRCUIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PmealcircuitVersion="$VERSION" testDebugUnitTest lintRelease assembleRelease bundleRelease
      - name: Normalize the Android APK path for unsigned validation builds
        if: env.ANDROID_SIGNING_AVAILABLE != 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "A tagged release may not normalize an unsigned Android APK." >&2
            exit 1
          fi
          unsigned_apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          canonical_apk=android/app/build/outputs/apk/release/app-release.apk
          [[ -f "$unsigned_apk" ]]
          install -m 644 "$unsigned_apk" "$canonical_apk"
      - name: Verify release APK version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.contract.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$EXPECTED_VERSION"
          expected_code=$((major * 1000000 + minor * 10000 + patch))
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk \
            | grep -F "versionCode='$expected_code' versionName='$EXPECTED_VERSION'"
      - name: Verify Android signer continuity and AAB signature
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          expected_fingerprint=$(printf '%s' "$EXPECTED_ANDROID_SIGNER_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          apk_cert_output=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$apk_cert_output"
          mapfile -t apk_fingerprints < <(
            printf '%s\n' "$apk_cert_output" \
              | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )
          if (( ${#apk_fingerprints[@]} != 1 )); then
            echo "Expected exactly one APK signer certificate, found ${#apk_fingerprints[@]}." >&2
            exit 1
          fi
          if [[ "${apk_fingerprints[0]}" != "$expected_fingerprint" ]]; then
            echo "APK signer certificate does not match the trusted v0.3.0 release signer." >&2
            exit 1
          fi
          keytool -exportcert \
            -keystore "$RUNNER_TEMP/mealcircuit.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/android-release-cert.der"
          keystore_fingerprint=$(sha256sum "$RUNNER_TEMP/android-release-cert.der" | awk '{print toupper($1)}')
          if [[ "$keystore_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Restored keystore alias does not match the trusted v0.3.0 release signer." >&2
            exit 1
          fi
          jarsigner -verify -strict \
            -keystore "$RUNNER_TEMP/mealcircuit.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
      - name: Verify legal assets in final Android artifacts
        run: |
          python tools/android_artifact_legal_check.py --license LICENSE \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Stage Android release assets
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          install -m 644 android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/android-release/app-release.apk"
          install -m 644 android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/android-release/app-release.aab"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          if-no-files-found: error
          path: ${{ runner.temp }}/android-release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contract, quality-gate, windows, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.contract.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: release-assets
      - name: Verify the exact final artifact manifest
        shell: bash
        run: |
          expected=(
            "MealCircuit-$VERSION-windows-x64-portable.zip"
            "MealCircuit-$VERSION-windows-x64-setup.exe"
            "app-release.apk"
            "app-release.aab"
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Generate lock-derived CycloneDX SBOM
        run: python tools/generate_sbom.py --output "release-assets/MealCircuit-v$VERSION.cdx.json"
      - name: Generate checksums
        run: cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/releases/v${{ needs.contract.outputs.version }}.md
          files: release-assets/*
