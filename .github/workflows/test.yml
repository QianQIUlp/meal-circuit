name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 5 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate workflow syntax and semantics
        run: actionlint .github/workflows/*.yml
      - name: Verify malformed indentation is rejected
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint
        run: python -m unittest tests.test_workflow_syntax -v
      - id: version
        run: python tools/version.py --check --output "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --locked --extra server --extra sync --group dev
      - run: uv run python tools/dependency_check.py
      - run: uv run python tools/generate_openapi.py --check
      - run: uv run python tools/validate_protocol.py
      - run: uv run python -m unittest tests.test_release_workflow -v

  python-base:
    needs: contract
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: .\test.ps1
      - run: python tools/release_check.py
      - run: python tools/version.py --check
      - run: python -m compileall -q mealcircuit sync_server tests tools
      - run: git diff --check

  sync-postgres:
    needs: contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: mealcircuit
          POSTGRES_USER: mealcircuit
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mealcircuit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEALCIRCUIT_SYNC_DATABASE_URL: postgresql+psycopg://mealcircuit:integration-password@localhost:5432/mealcircuit
      MEALCIRCUIT_SYNC_POSTGRES_TEST_URL: postgresql+psycopg://mealcircuit:integration-password@localhost:5432/mealcircuit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --locked --extra server --extra sync --group dev
      - run: uv run alembic -c sync_server/alembic.ini upgrade head
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python tools/generate_openapi.py --check
      - run: uv run python tools/validate_protocol.py
      - run: uv run python tools/release_check.py

  android:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon -PmealcircuitVersion="${{ needs.contract.outputs.version }}" testDebugUnitTest assembleDebug lintDebug compileDebugAndroidTestKotlin
        working-directory: android
      - name: Verify debug APK version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.contract.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$EXPECTED_VERSION"
          expected_code=$((major * 1000000 + minor * 10000 + patch))
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -F "versionCode='$expected_code' versionName='$EXPECTED_VERSION'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-instrumentation:
    needs: contract
    # The emulator action is designed for hardware-accelerated macOS runners.
    # Ubuntu's no-KVM fallback can report sys.boot_completed before Android's
    # package/input/settings services are stable enough to run instrumentation.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --locked --extra server --extra sync --group dev
      - name: Start real sync service and seed Python desktop revision
        run: |
          export MEALCIRCUIT_SYNC_DATABASE_URL="sqlite+pysqlite:///$RUNNER_TEMP/cross-client-server.db"
          export MEALCIRCUIT_SYNC_BLOB_ROOT="$RUNNER_TEMP/cross-client-blobs"
          export MEALCIRCUIT_SYNC_REGISTRATION_MODE=open
          uv run alembic -c sync_server/alembic.ini upgrade head
          uv run uvicorn sync_server.main:app --host 127.0.0.1 --port 18080 >"$RUNNER_TEMP/sync-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sync-server.pid"
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18080/healthz
          uv run python -m tools.cross_client_sync_test prepare \
            --home "$RUNNER_TEMP/python-prepare" \
            --state "$RUNNER_TEMP/cross-client-state.json"
          SYNC_RECOVERY=$(uv run python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "cross-client-state.json")))["recovery_key"])')
          # healthz responses do not end with a newline. Force the workflow
          # command onto its own line so GitHub actually registers the mask.
          printf '\n::add-mask::%s\n' "$SYNC_RECOVERY"
          printf 'SYNC_RECOVERY=%s\n' "$SYNC_RECOVERY" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb reverse tcp:18080 tcp:18080
            ./android/gradlew --no-daemon -p android connectedDebugAndroidTest -PmealcircuitVersion="${{ needs.contract.outputs.version }}" -Pandroid.testInstrumentationRunnerArguments.syncServerUrl=http://127.0.0.1:18080 -Pandroid.testInstrumentationRunnerArguments.syncLogin=cross-client -Pandroid.testInstrumentationRunnerArguments.syncPassword=synthetic-cross-client-password -Pandroid.testInstrumentationRunnerArguments.syncRecovery="$SYNC_RECOVERY"
      - name: Verify Android revision from Python desktop client
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cross-client-state.json" ]; then
            uv run python -m tools.cross_client_sync_test verify \
              --home "$RUNNER_TEMP/python-verify" \
              --state "$RUNNER_TEMP/cross-client-state.json" \
              --server-database "$RUNNER_TEMP/cross-client-server.db" \
              --server-blob-root "$RUNNER_TEMP/cross-client-blobs" \
              --server-log "$RUNNER_TEMP/sync-server.log" \
              --backup-output "$RUNNER_TEMP/cross-client-server-backup.db"
          fi
          if [ -f "$RUNNER_TEMP/sync-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/sync-server.pid")" || true
          fi

  supply-chain:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv run pip-audit --requirement requirements/sync-server.lock
      - run: uv export --locked --extra desktop --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/desktop-resolved.txt"
      - run: uv run pip-audit --requirement "$RUNNER_TEMP/desktop-resolved.txt"
      - run: uv run python tools/dependency_check.py
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: mealcircuit-source.cdx.json
          artifact-name: mealcircuit-source-sbom
